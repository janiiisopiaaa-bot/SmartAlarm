<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualisasi Alarm</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    #bar { background: #ddd; border-radius: 8px; height: 24px; overflow: hidden; }
    #isi { background: #2f4bff; height: 100%; width: 0; }
  </style>
</head>
<body>
  <p><a href="/">Alarm</a> | <a href="/visualisasi">Visualisasi</a></p>
  <h1>Visualisasi Alarm</h1>

  <p>Jam alarm: <b id="infoJam"></b></p>
  <p>Status: <b id="infoStatus"></b></p>

  <p>Posisi jam sekarang dalam sehari:</p>
  <div id="bar"><div id="isi"></div></div>
  <p id="sisa"></p>

<script>
const alarm = JSON.parse(localStorage.getItem("alarm")) || { waktu: "", aktif: false };

document.getElementById("infoJam").textContent = alarm.waktu || "Belum diatur";
document.getElementById("infoStatus").textContent = alarm.aktif ? "Aktif" : "Mati";

function perbarui() {
  const now = new Date();
  const menitSekarang = now.getHours() * 60 + now.getMinutes();
  document.getElementById("isi").style.width = (menitSekarang / 1440 * 100) + "%";

  if (alarm.waktu) {
    const [h, m] = alarm.waktu.split(":").map(Number);
    let selisih = h * 60 + m - menitSekarang;
    if (selisih < 0) selisih += 1440;   // alarm besok
    document.getElementById("sisa").textContent =
      "Alarm berbunyi " + Math.floor(selisih / 60) + " jam " + (selisih % 60) + " menit lagi";
  }
}
perbarui();
setInterval(perbarui, 30000);
</script>
</body>
</html>
