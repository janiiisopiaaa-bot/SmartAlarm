<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualisasi Alarm</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf2f8;color:#5b4b6b;font-family:system-ui,sans-serif}
.box{background:#fff;width:90%;max-width:560px;padding:24px;border-radius:20px;box-shadow:0 4px 16px #e9d5ff}
h1{margin-top:0;font-weight:400;color:#a78bfa}
.bar{position:relative;height:40px;background:#e0f2fe;border-radius:12px;margin:20px 0 6px}
.mark{position:absolute;top:-6px;width:6px;height:52px;border-radius:3px}
#now{background:#a78bfa}
#alarm{background:#fb923c;display:none}
.scale{display:flex;justify-content:space-between;font-size:.8rem}
a{color:#a78bfa}
</style>
</head>
<body>
<div class="box">
  <h1>Posisi alarm dalam 24 jam</h1>
  <p id="info">Belum ada alarm yang diatur.</p>
  <div class="bar"><div class="mark" id="now"></div><div class="mark" id="alarm"></div></div>
  <div class="scale"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
  <p><b style="color:#a78bfa">|</b> Sekarang &nbsp; <b style="color:#fb923c">|</b> Alarm</p>
  <a href="/">&larr; Kembali ke alarm</a>
</div>

<script>
const minutes = (h, m) => h * 60 + m;

function draw() {
  const now = new Date();
  const nowMin = minutes(now.getHours(), now.getMinutes());
  document.getElementById("now").style.left = nowMin / 1440 * 100 + "%";

  const alarm = JSON.parse(localStorage.getItem("smartAlarm"));
  if (!alarm || !alarm.time) return;

  const [h, m] = alarm.time.split(":").map(Number);
  const el = document.getElementById("alarm");
  el.style.display = "block";
  el.style.left = minutes(h, m) / 1440 * 100 + "%";

  let diff = minutes(h, m) - nowMin;
  if (diff < 0) diff += 1440;
  document.getElementById("info").textContent =
    "Alarm jam " + alarm.time + " (" + (alarm.active ? "aktif" : "mati") + "), " +
    Math.floor(diff / 60) + " jam " + (diff % 60) + " menit lagi.";
}

draw();
setInterval(draw, 30000);
</script>
</body>
</html>
