<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Alarm</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf2f8;color:#5b4b6b;font-family:system-ui,sans-serif}
.box{background:#fff;width:90%;max-width:380px;padding:24px;border-radius:20px;text-align:center;box-shadow:0 4px 16px #e9d5ff}
h1{margin:0;font-size:3rem;font-weight:400;color:#a78bfa}
input,button{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #e9d5ff;background:#fff;color:inherit}
button{cursor:pointer;background:#c4b5fd;border-color:#c4b5fd;color:#fff}
button:hover{background:#a78bfa}
.btn2{background:#a7f3d0;border-color:#a7f3d0;color:#3d6b57}
.btn3{background:#fed7aa;border-color:#fed7aa;color:#8a5a2b}
p{margin:12px 0}
#ring{display:none;background:#fecdd3;border-radius:12px;padding:12px}
a{color:#a78bfa}
</style>
</head>
<body>
<div class="box">
  <h1 id="clock">--:--:--</h1>
  <p><input type="time" id="time"> <button onclick="setAlarm()">Atur alarm</button></p>
  <p>Jam alarm: <b id="sTime"></b><br>Status: <b id="sState"></b></p>
  <p>
    <button class="btn2" id="toggle" onclick="toggleAlarm()"></button>
    <button class="btn3" onclick="beep(1500)">Tes bunyi</button>
  </p>
  <div id="ring"><p><b>Alarm berbunyi!</b></p><button onclick="stopAlarm()">Matikan</button></div>
</div>

<script>
let alarm = JSON.parse(localStorage.getItem("smartAlarm")) || { time: "", active: false };
let audio, timer, lastFired = "";
const $ = id => document.getElementById(id);

function show() {
  $("sTime").textContent = alarm.time || "Belum diatur";
  $("sState").textContent = alarm.active ? "Aktif" : "Mati";
  $("toggle").textContent = alarm.active ? "Nonaktifkan" : "Aktifkan";
  localStorage.setItem("smartAlarm", JSON.stringify(alarm));
}

function beep(ms) {
  audio = audio || new AudioContext();
  const osc = audio.createOscillator();
  osc.frequency.value = 2000;
  osc.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + ms / 1000);
}

function setAlarm() {
  if (!$("time").value) return alert("Pilih jam dulu");
  beep(1); // mengaktifkan audio browser
  alarm.time = $("time").value;
  show();
}

function toggleAlarm() {
  if (!alarm.time) return alert("Atur jam alarm dulu");
  beep(1);
  alarm.active = !alarm.active;
  show();
}

function stopAlarm() {
  clearInterval(timer);
  $("ring").style.display = "none";
  alarm.active = false;
  show();
}

setInterval(() => {
  const now = new Date();
  $("clock").textContent = now.toTimeString().slice(0, 8);
  const hm = now.toTimeString().slice(0, 5);
  if (alarm.active && alarm.time === hm && lastFired !== hm) {
    lastFired = hm;
    $("ring").style.display = "block";
    beep(400);
    timer = setInterval(() => beep(400), 800);
  }
}, 1000);

$("time").value = alarm.time;
show();
</script>
</body>
</html>
