<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Alarm</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    #jam { font-size: 3rem; font-weight: bold; }
    input, button { font-size: 1rem; padding: .6rem; margin: .25rem; }
    #bunyi { background: #d93f3f; color: white; padding: 1rem; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <p><a href="/">Alarm</a> | <a href="/visualisasi">Visualisasi</a></p>
  <h1>Smart Alarm</h1>
  <div id="jam">--:--:--</div>

  <div id="bunyi">
    Alarm berbunyi!<br>
    <button onclick="hentikan()">Hentikan</button>
  </div>

  <p>
    <input type="time" id="waktu">
    <button onclick="atur()">Atur alarm</button>
  </p>

  <p>Jam alarm: <b id="infoJam"></b></p>
  <p>Status: <b id="infoStatus"></b></p>

  <button onclick="toggle()">Aktifkan / Nonaktifkan</button>
  <button onclick="bunyikan(3)">Tes bunyi</button>

<script>
// Data alarm disimpan di browser (localStorage)
let alarm = JSON.parse(localStorage.getItem("alarm")) || { waktu: "", aktif: false };
let audio, timer, sudahBunyi = "";

function simpan() {
  localStorage.setItem("alarm", JSON.stringify(alarm));
  tampil();
}

function tampil() {
  document.getElementById("infoJam").textContent = alarm.waktu || "Belum diatur";
  document.getElementById("infoStatus").textContent = alarm.aktif ? "Aktif" : "Mati";
  document.getElementById("waktu").value = alarm.waktu;
}

function atur() {
  alarm.waktu = document.getElementById("waktu").value;
  simpan();
}

function toggle() {
  if (!alarm.waktu) return alert("Atur jam alarm dulu!");
  alarm.aktif = !alarm.aktif;
  simpan();
}

// Pengganti winsound.Beep: bunyi lewat browser
function bunyikan(detik) {
  hentikan();
  audio = audio || new AudioContext();
  document.getElementById("bunyi").style.display = "block";
  let hitung = 0;
  timer = setInterval(() => {
    const osc = audio.createOscillator();
    osc.frequency.value = 1000;
    osc.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.4);
    if (++hitung >= detik * 1.4) hentikan();
  }, 700);
}

function hentikan() {
  clearInterval(timer);
  document.getElementById("bunyi").style.display = "none";
}

// Cek tiap detik: tampilkan jam & bunyikan alarm jika waktunya sama
setInterval(() => {
  const s = new Date().toTimeString().slice(0, 8);   // "HH:MM:SS"
  const hhmm = s.slice(0, 5);
  document.getElementById("jam").textContent = s;

  if (alarm.aktif && alarm.waktu === hhmm && sudahBunyi !== hhmm) {
    sudahBunyi = hhmm;
    bunyikan(30);
  }
}, 1000);

tampil();
</script>
</body>
</html>
