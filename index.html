<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Alarm</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf2f8;color:#5b4b6b;font-family:system-ui,sans-serif}
.box{background:#fff;width:90%;max-width:380px;padding:24px;border-radius:20px;text-align:center;box-shadow:0 4px 16px #e9d5ff}
h1{margin:0;font-size:3rem;font-weight:400;color:#a78bfa}
input,button{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #e9d5ff;background:#fff;color:inherit}
button{cursor:pointer;background:#c4b5fd;border-color:#c4b5fd;color:#fff}
button:hover{background:#a78bfa}
.hijau{background:#a7f3d0;border-color:#a7f3d0;color:#3d6b57}
.oranye{background:#fed7aa;border-color:#fed7aa;color:#8a5a2b}
form{display:inline}
p{margin:12px 0}
.pesan{background:#e0f2fe;border-radius:12px;padding:8px}
#ring{display:none;background:#fecdd3;border-radius:12px;padding:12px}
a{color:#a78bfa}
</style>
</head>
<body>
<div class="box">
  <p>Smart Alarm</p>
  <h1 id="jam">--:--:--</h1>

  <div id="ring">
    Kring kring! Alarm berbunyi!<br><br>
    <button onclick="hentikan()">Hentikan</button>
  </div>

  <p>
    <input type="time" id="waktu">
    <button onclick="atur()">Atur alarm</button>
  </p>

  <div class="pesan">
    <p>Jam alarm: <b id="infoJam"></b></p>
    <p>Status: <b id="infoStatus"></b></p>
  </div>

  <p>
    <button class="hijau" onclick="toggle()">Aktifkan / Nonaktifkan</button>
    <button class="oranye" onclick="bunyikan(5)">Tes bunyi</button>
  </p>
</div>

<script>
// Data alarm disimpan di browser (localStorage)
let alarm = JSON.parse(localStorage.getItem("alarm")) || { waktu: "", aktif: false };
let audio, timer, sudahBunyi = "";

function simpan() {
  localStorage.setItem("alarm", JSON.stringify(alarm));
  tampil();
}

function tampil() {
  document.getElementById("infoJam").textContent = alarm.waktu || "Belum diatur";
  document.getElementById("infoStatus").textContent = alarm.aktif ? "Aktif" : "Mati";
  document.getElementById("waktu").value = alarm.waktu;
}

// Browser hanya mengizinkan suara setelah pengguna mengklik sesuatu
function siapkanAudio() {
  audio = audio || new AudioContext();
  if (audio.state === "suspended") audio.resume();
}

function atur() {
  siapkanAudio();
  alarm.waktu = document.getElementById("waktu").value;
  simpan();
}

function toggle() {
  if (!alarm.waktu) return alert("Atur jam alarm dulu!");
  siapkanAudio();
  alarm.aktif = !alarm.aktif;
  simpan();
}

// Satu "kring": nada tinggi yang digetarkan cepat (25x per detik) selama 0.5 detik
function kring() {
  const nada = audio.createOscillator();
  const getar = audio.createOscillator();
  const volume = audio.createGain();
  const kedalaman = audio.createGain();

  nada.type = "triangle";
  nada.frequency.value = 1350;
  getar.type = "square";
  getar.frequency.value = 30;
  volume.gain.value = 0.5;
  kedalaman.gain.value = 0.5;

  getar.connect(kedalaman);
  kedalaman.connect(volume.gain);
  nada.connect(volume);
  volume.connect(audio.destination);

  const t = audio.currentTime;
  nada.start(t);   getar.start(t);
  nada.stop(t + 0.5); getar.stop(t + 0.5);
}

// Pola: kring... kring... (jeda) ... diulang tiap 1,5 detik
function bunyikan(detik) {
  hentikan();
  siapkanAudio();
  document.getElementById("ring").style.display = "block";
  let hitung = 0;
  const ulang = () => {
    kring();
    setTimeout(kring, 600);
    if (++hitung >= detik / 1.5) hentikan();
  };
  ulang();
  timer = setInterval(ulang, 1500);
}

function hentikan() {
  clearInterval(timer);
  document.getElementById("ring").style.display = "none";
}

// Cek tiap detik: tampilkan jam & bunyikan alarm jika waktunya sama
setInterval(() => {
  const s = new Date().toTimeString().slice(0, 8);   // "HH:MM:SS"
  const hhmm = s.slice(0, 5);
  document.getElementById("jam").textContent = s;

  if (alarm.aktif && alarm.waktu === hhmm && sudahBunyi !== hhmm) {
    sudahBunyi = hhmm;
    bunyikan(30);
  }
}, 1000);

tampil();
</script>
</body>
</html>
