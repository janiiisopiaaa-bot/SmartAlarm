<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Alarm</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf2f8;color:#5b4b6b;font-family:system-ui,sans-serif}
.box{background:#fff;width:90%;max-width:380px;padding:24px;border-radius:20px;text-align:center;box-shadow:0 4px 16px #e9d5ff}
h1{margin:0;font-size:3rem;font-weight:400;color:#a78bfa}
input,button{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #e9d5ff;background:#fff;color:inherit}
button{cursor:pointer;background:#c4b5fd;border-color:#c4b5fd;color:#fff}
button:hover{background:#a78bfa}
.btn2{background:#a7f3d0;border-color:#a7f3d0;color:#3d6b57}
.btn3{background:#fed7aa;border-color:#fed7aa;color:#8a5a2b}
p{margin:12px 0}
#ring{display:none;background:#fecdd3;border-radius:12px;padding:12px}
#yt{position:fixed;left:-9999px;top:0;width:200px;height:200px}
small{color:#9a8aa8}
a{color:#a78bfa}
</style>
</head>
<body>
<div class="box">
  <h1 id="clock">--:--:--</h1>
  <p><input type="time" id="time"> <button onclick="setAlarm()">Atur alarm</button></p>
  <p>Jam alarm: <b id="sTime"></b><br>Status: <b id="sState"></b></p>
  <p>
    <button class="btn2" id="toggle" onclick="toggleAlarm()"></button>
    <button class="btn3" onclick="testSound()">Tes bunyi</button>
  </p>
  <p><small id="ytState">Memuat suara dari YouTube...</small></p>
  <div id="ring"><p><b>Alarm berbunyi!</b></p><button onclick="stopAlarm()">Matikan</button></div>
</div>

<!-- Pemutar YouTube tersembunyi: hanya diambil suaranya -->
<div id="yt"></div>

<script>
const VIDEO_ID = "nsw8H9V3D54"; // dari https://youtu.be/nsw8H9V3D54

let alarm = JSON.parse(localStorage.getItem("smartAlarm")) || { time: "", active: false };
let lastFired = "", testTimer, player, ytReady = false, busy = false;
const $ = id => document.getElementById(id);

// ---------- YouTube ----------
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player("yt", {
    videoId: VIDEO_ID,
    width: 200,
    height: 200,
    playerVars: { playsinline: 1, controls: 0, rel: 0 },
    events: {
      onReady: () => { ytReady = true; $("ytState").textContent = "Suara alarm siap."; },
      onStateChange: e => {
        // ulang terus selama alarm berbunyi
        if (e.data === YT.PlayerState.ENDED && busy) { player.seekTo(0); player.playVideo(); }
      },
      onError: () => { $("ytState").textContent = "Video tidak bisa diputar (mungkin tidak boleh di-embed)."; }
    }
  });
}

function playSound() {
  if (!ytReady) return;
  busy = true;
  player.unMute();
  player.seekTo(0);
  player.playVideo();
}

function stopSound() {
  busy = false;
  if (!ytReady) return;
  player.pauseVideo();
  player.seekTo(0);
}

// Browser hanya mengizinkan suara setelah klik pengguna,
// jadi pemutar "dibuka" diam-diam saat tombol diklik.
function unlockAudio() {
  if (!ytReady || busy) return;
  player.mute();
  player.playVideo();
  setTimeout(() => { if (!busy) { player.pauseVideo(); player.seekTo(0); } player.unMute(); }, 700);
}

function testSound() {
  if (!ytReady) return alert("Suara dari YouTube belum siap, tunggu sebentar atau cek koneksi internet.");
  if ($("ring").style.display === "block") return; // jangan ganggu alarm yang sedang bunyi
  playSound();
  clearTimeout(testTimer);
  testTimer = setTimeout(stopSound, 5000);
}

// ---------- Alarm ----------
function show() {
  $("sTime").textContent = alarm.time || "Belum diatur";
  $("sState").textContent = alarm.active ? "Aktif" : "Mati";
  $("toggle").textContent = alarm.active ? "Nonaktifkan" : "Aktifkan";
  localStorage.setItem("smartAlarm", JSON.stringify(alarm));
}

function setAlarm() {
  if (!$("time").value) return alert("Pilih jam dulu");
  unlockAudio();
  alarm.time = $("time").value;
  show();
}

function toggleAlarm() {
  if (!alarm.time) return alert("Atur jam alarm dulu");
  unlockAudio();
  alarm.active = !alarm.active;
  show();
}

function stopAlarm() {
  stopSound();
  $("ring").style.display = "none";
  alarm.active = false;
  show();
}

setInterval(() => {
  const now = new Date();
  $("clock").textContent = now.toTimeString().slice(0, 8);
  const hm = now.toTimeString().slice(0, 5);
  if (alarm.active && alarm.time === hm && lastFired !== hm) {
    lastFired = hm;
    $("ring").style.display = "block";
    clearTimeout(testTimer);
    playSound();
  }
}, 1000);

$("time").value = alarm.time;
show();
</script>
</body>
</html>
